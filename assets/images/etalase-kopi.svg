<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Etalase Kopi Bangsa</title>
  <desc id="desc">Ilustrasi tiga kemasan kopi, secangkir kopi, dan biji kopi di atas meja kayu.</desc>
  <defs>
